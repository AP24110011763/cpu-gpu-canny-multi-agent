name: Bot 2 - Inbox Organizer

on:
  push:
    paths: ['inbox/**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bot2-inbox
  cancel-in-progress: false

jobs:
  organize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot2/requirements.txt
      - name: Organize inbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot2 organize
