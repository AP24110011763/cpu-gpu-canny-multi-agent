name: Bot 1 - Inbox Organizer

# Upload a file into inbox/ and this bot moves it to the right folder.
on:
  push:
    paths: ['inbox/**']
  workflow_dispatch:

permissions:
  contents: write   # move files and commit
  issues: write     # post updates to the activity log

concurrency:
  group: bot1-inbox
  cancel-in-progress: false

jobs:
  organize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot1/requirements.txt
      - name: Organize inbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: smarter folder choice
        run: python -m bot1 organize
