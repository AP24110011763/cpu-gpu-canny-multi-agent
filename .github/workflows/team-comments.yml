name: Team - Talk to the bots

# Comment "/bot1 help" or "/bot2 help" on any issue or pull request and the bot answers in the same thread.
# Only the repository owner, members and collaborators can give commands.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write        # Bot 1 moves/deletes files, and sends messages to Bot 2
  issues: write
  pull-requests: write   # Bot 2 posts PR reviews

concurrency:
  group: team-commands
  cancel-in-progress: false

jobs:
  reply:
    if: >-
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/bot1') || contains(github.event.comment.body, '/bot2') ||
       contains(github.event.comment.body, '@bot1') || contains(github.event.comment.body, '@bot2'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # always run trusted default-branch code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot1/requirements.txt
      - name: Answer the comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m team comment
