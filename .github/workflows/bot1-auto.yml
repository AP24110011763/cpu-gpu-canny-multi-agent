name: Bot 1 - Daily Updates

on:
  schedule:
    - cron: '30 17 * * *'
  push:
    branches: [main]
    paths-ignore:
      - DAILY_UPDATES.md
      - PROJECT_REPORT.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot1-auto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot1/requirements.txt
      - name: Write the files
        run: python -m bot1.daily_log
      - name: Commit and push if anything changed
        run: |
          git config user.name "bot1"
          git config user.email "bot1@users.noreply.github.com"
          git add DAILY_UPDATES.md PROJECT_REPORT.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Bot 1: update daily log and project report"
            git push
          fi
