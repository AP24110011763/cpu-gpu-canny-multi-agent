name: Bot 1 - Repo Activity Updates

# Posts what happens in your repo (pushes, pull requests, issues) to one "Activity Log" issue.
on:
  push:
    paths-ignore: ['inbox/**']
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    # Skip events caused by bots to avoid noise.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # always run the trusted default-branch code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bot1/requirements.txt
      - name: Post update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m bot1 activity
